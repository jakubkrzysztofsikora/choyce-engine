[package]
name = "choyce-shell"
version = "0.1.0"
description = "Choyce Engine — Tauri 2 shell for kid-safe Polish-language game engine."
authors = ["Choyce Engine"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "choyce_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
