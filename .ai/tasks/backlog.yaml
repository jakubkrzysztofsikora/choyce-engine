      - MEDIUM: world.game_rules = compiled_rules (line 59) replaces ALL rules in the world on each execute() call. If rules were added by other sources (e.g., template loaders, AI-suggested rules) or if execute() is called with a partial block set, previously compiled rules are silently lost. Consider merging by rule_id or accepting an incremental compile mode. Document this as a full-recompile semantic if intentional.
      - MEDIUM: No validation on user-provided values (event names, action names, item_ids) used in DSL compilation. Values like 'tap;inject()' would produce malformed DSL 'on_tap;inject():spawn_confetti()'. While DSL is currently metadata-only, downstream consumers may parse and execute it. Add basic alphanumeric/underscore validation for identifiers used in DSL strings.
      - LOW: _build_script_stub() only escapes double quotes in DSL but not backslashes or newlines. If rule_id or DSL contains a backslash or newline, the generated GDScript stub will be syntactically invalid. Add dsl.replace('\\\\', '\\\\\\\\') before the quote escape, and strip newlines from identifiers.
      - LOW: Event new_state field 'parent_script_bridge' stores only the boolean from editable_in_parent_mode, not the bridge dictionary. The field name suggests it contains the bridge itself. Consider renaming to 'has_parent_script_bridge' for clarity, or include the full bridge for downstream consumers like the parent audit timeline.
