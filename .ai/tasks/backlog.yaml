      - PASS: All five rule categories (EVENT_TRIGGER, TIMER, SCORING, WIN_CONDITION, ITEM_SPAWN) compile to deterministic DSL. Six type aliases (SCORE, CHECKPOINT, PUZZLE, SPAWN, COLLECT, RESOURCE, GROWTH) correctly map to domain enums.
