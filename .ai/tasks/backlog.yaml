  - id: VS-044
    title: Align the Adventure river with the bridge and compose a dense opening grove
    owner: codex
    specialty: visual-world-grounding
    inputs:
      - PLAN.md
      - .ai/research-compendium/RESEARCH_VS-013_Opening_Route_Composition.md
      - src/adapters/inbound/gameplay/world_renderer.gd
      - src/adapters/inbound/gameplay/shaders/adventure_water.gdshader
    dependencies: [VS-012, VS-013]
    acceptance_criteria:
      - The rendered river mesh and shallow swim volume both cross z=-24 at the authored bridge, without a second Z translation cutting through the homestead
      - The opening camera reads as a clearing framed by layered human-scale foliage, while the bridge and two walking routes remain unobstructed
      - River material retains visible animated depth without reading as a white or grey placeholder plane
      - Focused renderer coverage, a fresh live capture, and independent adversarial review are retained as evidence
    cross_review_by: claude
    status: in_progress
    codex_cr_findings:
      - HIGH: The visible river meanders, but swimming uses one fixed 22m-wide rectangular Area at z=-24. Away from the bridge, visible water and water physics diverge. Replace it with sampled/segmented volumes following _river_bank_pair(), then test enter/exit at bridge and meander extrema.
      - HIGH: The capture still reads as a huge empty lawn with isolated toy trees. The forest mass begins too far behind the river to frame the opening, so the required layered, human-scale grove is not achieved. Add coherent close/mid-ground foliage and understory outside the route corridors, then recapture the opening.
      - HIGH: Photographic leaf texture on rounded low-poly canopy meshes remains visibly incompatible with the toy silhouettes, striped trunks, ground, and characters. This fails the cohesive material/asset-language gate. Use a stylized foliage material compatible with the mesh, or replace the trees with compatible textured models.
      - HIGH: The river remains a visually flat dark-cyan strip with hard shoreline edges; shallow-bank/deep-channel and current cues are not legible in the live third-person evidence. Strengthen visible shore/depth contrast and motion, then retain evidence from both bridge approaches.
      - HIGH: Visible bridge stairs and rails use generic collider boxes rather than matching collision geometry; replace them with authored dimensions or limited static mesh shapes and add bidirectional traversal coverage.
      - HIGH: The wet-bank ribbon is globally offset by 0.208m and floats above terrain outside the flat opening; terrain-ground the outer bank and lift only the inner edge to the water surface.
      - HIGH: The opening still reads as a sparse prototype: bare repeated ground, lollipop-tree rows and test-piece shrubs do not meet the layered forest clearing criterion.
      - HIGH: The default blue-uniform hero contradicts the approved Ziemek/Gniewko direction; VS-046 must deliver concept-derived rig appearances and live captures.
      - HIGH: Do not remove the safety ground collider merely because Terrain3D was asked to rebuild; retain it until live terrain ray contacts prove the active spawn and bridge bank are backed by Terrain3D collision.
      - HIGH: Pure bank-height math is insufficient. Add extension-gated integration coverage for imported terrain, dynamic collision and spawn/bank ray contact.
      - MEDIUM: Bridge coverage proves node existence only, not traversal. A deck/ramp seam, rail overlap, or terrain mismatch can still block the real player while all tests pass. Add bidirectional CharacterBody3D physics traversal coverage and live walk evidence.
      - MEDIUM: A 0.62 shadowless FillLight is active throughout the day as well as night; make it time-of-day responsive and prove night route readability in rendered evidence.
      - MEDIUM: The camera evidence still reads as a flat dark river strip; make shallow/deep contrast and directional motion visible from shore, bridge and in-water viewpoints.
      - MEDIUM: Build the HUD and inspect actual slot children/icons/active border; retain a clean, unobstructed capture.
      - LOW: The roof caps visibly improve the gable, but the distant capture does not show the door or verify its 2.2m collision alignment. Add a close open/closed door capture plus player passage test before claiming the house repair verified.
      - LOW: Focused structural tests pass but emit cleanup warnings and do not prove bridge traversal; live evidence remains the acceptance authority.
      - LOW: Desktop-window-obscured screenshots cannot close the visual gate. The first vista remains flat lawn plus a cyan river strip; captured visual evidence must be unobstructed and show traversal.
      - HIGH: Normalized full-river UVs leave no legible flow pattern in the bridge camera; derive DUDV from local/world metres and retain temporal runtime evidence.
      - MEDIUM: Cosmetic vertex-wave amplitude exceeds the fixed water-volume contact tolerance; reduce or recalibrate it.
      - MEDIUM: Contracts must inspect material runtime parameters and generated mesh density, not only shader source fragments.
      - LOW: Headless exits report resource leaks; improve isolated teardown before using tests as clean runtime-safety evidence.
      - HIGH: The initial black-crown failure is fixed, but the forest still needs deeper material variation and stronger environmental integration to stop reading as a uniform tree wall.
      - HIGH: The white shoreline cube is removed, but the opening remains a broad bare lawn with a flat water band and sparse foreground. Add terrain-conforming bank and layered low/mid vegetation, then retain a bridge-to-forest child-height traversal capture.
      - HIGH: Visual-only riverbank props must terrain-ground independently of collision and be tested against the imported terrain height and swim channel.
      - HIGH: Visual gate remains open: water, foreground lawn, and mixed toy-scale assets do not yet deliver the required natural opening composition.
      - MEDIUM: Use a session/generation token and exact adapter reference so stale collision probes cannot disable a later session's safety floor.
      - MEDIUM: The compact menu should not compete visually with world discovery; inspect the full first frame, not hotbar slots alone.
      - MEDIUM: Scale the chosen trunk profile with each generated visual scale; fixed world-space contact was incorrect for 2.45-3.95x tree variation.
      - MEDIUM: Use instantiated material and collider assertions rather than text-only path checks; live rendered evidence remains the acceptance authority.
      - HIGH: Cyan foliage artifacts, broad empty lawn, incompatible asset families and insufficient traversal evidence keep the visual gate open.
      - REQUEST_CHANGES: River-volume, foreground density/material cohesion, visual water depth and traversal evidence remain open. Floating wet banks, generic bridge colliders, prototype forest composition, hero direction and night proof remain open.
    evidence:
      - src/adapters/inbound/gameplay/world_renderer.gd (single-offset river transform, seeded colliding woodland clusters, calibrated named trunk/canopy materials)
      - src/adapters/inbound/gameplay/shaders/adventure_water.gdshader (Godot 4 Simple-Water-inspired DUDV flow, fragment channel depth, opaque Fresnel reflection)
      - tests/adapters/inbound/test_world_renderer_toon_shader.gd (bridge/water alignment and grove-frame regressions)
      - /tmp/choyce-world-audit-house-caps.png (fresh direct-play capture after forest/material, opaque-water, calibrated roof and visible-door pass; retained for adversarial review)
      - .ai/reviews/VS-044-codex-visual-runtime-review-2026-07-18.json (independent review: REQUEST_CHANGES; river-volume, foreground density/material cohesion, visual water depth and traversal evidence remain open)
      - /tmp/choyce-live-updated-world.png (fresh clean-process day capture after bank ribbons, closer forest masses and foreground thickets; confirms the river/forest image remains prototype-level and requires another review)
      - tests/adapters/inbound/test_world_renderer_toon_shader.gd (passing meander-volume, bank, forest and visible bridge-approach contracts)
      - .ai/reviews/VS-044-codex-visual-runtime-rereview-2026-07-18.json (independent re-review: REQUEST_CHANGES; floating wet banks, generic bridge colliders, prototype forest composition, hero direction and night proof remain open)
      - /tmp/choyce-live-grounded-banks.png (fresh direct-play capture after matched bridge-ramp collision and terrain-grounded wet-bank repair; visual gate still open)
      - src/adapters/inbound/gameplay/world_renderer.gd and shaders/adventure_water.gdshader (denser 192×12 render surface, normalized DUDV tiling and corrected runtime water uniforms; 96 collision volumes retained)
      - /tmp/choyce-water-flow-current.png (fresh direct-play capture after water pass; remains evidence of progress, not acceptance—the opening composition still reads prototype-level)
      - src/adapters/inbound/gameplay/shaders/forest_foliage.gdshader and world_renderer.gd (explicit readable foliage material plus per-source CC0 tree trunk collision profiles; replaces the black-crown trial)
      - /tmp/choyce-forest-readable-shore-rocks.png (fresh direct-play evidence: readable deep forest and irregular bridge rocks; remains below the visual-composition gate)
      - .ai/reviews/VS-044-forest-material-rereview-2026-07-18.json (independent adversarial re-review: REQUEST_CHANGES; opening composition and bank depth remain the gate)
      - /tmp/choyce-forest-lit-scaled-collision.png (fresh direct-play evidence after lighting-aware foliage and scale-matched tree contacts; still not acceptance evidence)
      - /tmp/choyce-riverbank-bush-only.png (fresh direct-play capture after rejecting cyan tall-plant meshes; valid visual baseline, but foreground/bank composition remains open)
      - src/adapters/inbound/gameplay/terrain3d_world_adapter.gd and tests/adapters/inbound/test_terrain3d_world_adapter.gd (bounded Terrain3D bank relief with channel/spawn/ramp contact contract)
      - .ai/reviews/VS-044-terrain-ui-review-2026-07-18.json (independent review: REQUEST_CHANGES; prompted extension-backed collision and live-HUD contracts)
      - tests/adapters/inbound/test_terrain3d_world_adapter.gd (Terrain3D extension import plus live dynamic-collision rays at spawn and both north-bank samples)
      - src/adapters/inbound/gameplay/gameplay_runtime.gd and world_renderer.gd (legacy safety floor remains until verified Terrain3D rays pass below player/camp and bridge-bank dressing)
      - tests/adapters/inbound/test_world_renderer_toon_shader.gd (riverbank props are asserted outside the meandering physical swim channel)
      - /tmp/choyce-opening-bank-props-grounded.jpg (clean direct-play opening capture; collision verified and water no longer pale cyan, but composition still fails the final visual gate)
      - .ai/reviews/VS-044-terrain-ui-rereview-2026-07-18.json (independent re-review: REQUEST_CHANGES; corrected visual-only bank grounding and stale collision probe lifecycle)
      - /tmp/choyce-opening-grounded-hud-v3.jpg (fresh unobstructed boot: Terrain3D collision verified and shader compiled; still explicit evidence that visual composition needs the next curated landmark/forest pass)
