  - id: TASK-028
    title: Implement parent advanced scripting editor with linting explain and diff preview
    owner: codex
    specialty: parent-tools
    inputs:
      - docs/requirements/functionality-requirements.md
      - docs/requirements/ui-ux-requirements.md
    dependencies: [TASK-014, TASK-022]
    acceptance_criteria:
      - Parent mode includes script editing, AI explain, and refactor suggestions
      - Every script mutation requires preview diff and supports rollback
    cross_review_by: claude
    status: done
    claude_cr_findings:
      - MEDIUM: LLM explain/refactor responses returned without output moderation. explain_script and suggest_refactor pass raw script code to the LLM and return the response directly via _llm.complete(prompt). The LLM output is not moderated through ModerationPort.check_text(). While this is parent-mode, the dual-filter moderation pattern used elsewhere in the engine should apply to all AI-generated text. An LLM that produces unsafe content in explanations would bypass moderation entirely. Recommendation: Add optional ModerationPort dependency and run check_text on LLM responses before returning. On BLOCK, return a safe alternative or generic explanation.
      - LOW: Mutation ID uses non-cryptographic hash with collision risk. _mutation_id uses GDScript .hash() which is not collision-resistant. If the clock has low resolution (same timestamp for consecutive calls), two mutations to the same project/path could get the same mutation_id, overwriting the pending mutation entry. Recommendation: Append an incrementing counter or use a UUID-like construction to ensure uniqueness.
      - LOW: _pending_mutations is unbounded and never pruned for abandoned previews. Applied mutations are erased from _pending_mutations, but abandoned previews (previewed but never applied) persist forever. A parent previewing many potential changes without applying them will accumulate stale entries. Recommendation: Add a max_pending limit or time-based expiry for previewed mutations that are never applied.
      - LOW: No moderation of new_code content in preview_mutation. preview_mutation accepts arbitrary new_code without content checks. While this is parent-mode, if a parent applies code containing unsafe content that subsequently becomes part of a published world, the moderation is only caught at publish time (if at all). Adding a WARN-level check at preview time could provide early feedback. Recommendation: Consider adding an optional moderation check on new_code content with WARN severity for parent mode.
      - LOW: Line diff algorithm is naive index-based comparison. _build_line_diff compares old and new lines by index position. If a single line is inserted in the middle, all subsequent lines appear as changes. This is acceptable for MVP but produces noisy diffs for insertions/deletions. Recommendation: Document as a known limitation. A future improvement could use longest common subsequence (LCS) for more accurate diffs.
      - PASS: Clean parent-mode gate on ALL operations via _can_access_parent_mode(actor)
      - PASS: Preview-before-apply enforcement — apply only works with previewed mutation IDs
      - PASS: Rollback restores exact previous script source with proper action log recording
      - PASS: Polish-first LLM prompts: 'Wyjasnij ten skrypt prostym jezykiem dla rodzica', 'Zaproponuj bezpieczny refaktor'
      - PASS: Clean ScriptRepositoryPort/InMemoryScriptRepository separation with composite key pattern
      - PASS: Explicit diff output in preview showing removed (-) and added (+) lines
      - PASS: 33 test assertions across 3 contracts covering parent gate, kid blocking, full mutation lifecycle
      - APPROVE: Well-structured parent scripting workflow with proper preview-before-apply enforcement, rollback support, and parent-mode gating. Polish-first LLM prompts for explain and refactor. Clean port/adapter separation.

  - id: TASK-029
    title: Implement parent zone controls for time limits social permissions and AI policies
    owner: claude
    specialty: safety-controls
    inputs:
