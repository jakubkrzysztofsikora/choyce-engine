  - id: TASK-043
    title: Implement AI memory layer for session context and summarized project history
    owner: codex
    specialty: ai-orchestration
    inputs:
      - docs/requirements/technology-requirements.md
      - docs/requirements/architecture-requirements.md
      - docs/requirements/functionality-requirements.md
    dependencies: [TASK-005, TASK-011, TASK-012]
    acceptance_criteria:
      - Session memory and long-term project summaries are maintained through explicit outbound ports
      - Memory compaction strategy preserves safety and audit requirements without leaking blocked content
      - Retrieval policy is deterministic and test-covered for kid and parent modes
    cross_review_by: claude
    status: done
    claude_cr_findings:
      - MEDIUM: Unbounded read pattern: list_session_entries(limit=100000) on every operation. record_turn, compact_project_history, and build_retrieval_context all call list_session_entries with limit=100000 to read all entries. For record_turn, this is solely to compute the next sequence number (existing.size() + 1). This is O(n) memory on every turn recording, where n grows with session length. Recommendation: Add a count_session_entries(session_id) method to AIMemoryStorePort to avoid loading all entries just for counting. Alternatively, store the sequence counter as session metadata.
      - MEDIUM: Non-cryptographic hash for audit content references. _hash_text uses GDScript's built-in .hash() (a non-cryptographic hash) for content_hash. These hashes are used as blocked_entry_refs in audit summaries. GDScript .hash() can produce collisions, meaning two different blocked texts could generate the same audit reference, making traceability ambiguous. Recommendation: Use a deterministic hash with lower collision risk. Consider computing an SHA-256 via HashingContext or at minimum combining .hash() with text length: 'h_%d_%d' % [absi(text.hash()), text.length()].
      - LOW: build_retrieval_context has auto-compaction side effect. When no project summary exists, build_retrieval_context automatically calls compact_project_history. This means a read-only retrieval operation triggers a write. Recommendation: Either document this behavior clearly or return an empty summary instead of auto-compacting.
      - LOW: Parent-only entries excluded from compaction lose long-term visibility. Parent-only entries are skipped during compact_project_history. If session entries are ever pruned for storage, parent notes are permanently lost with no compacted representation. Recommendation: Consider adding a parent_note_count field to the summary, or optionally include parent note excerpts in a parent-visible section of the summary.
      - LOW: No maximum session entries cap. InMemoryAIMemoryStore allows unbounded entry accumulation per session. A long or buggy session could fill memory. Recommendation: Add an optional max_entries_per_session parameter with FIFO eviction when exceeded.
      - LOW: No concurrency protection on compact_project_history. The version field increments from the current summary, but concurrent compaction calls could overwrite each other. Acceptable for MVP single-player/local-co-op. Document as a known limitation for future multi-session scenarios.
      - LOW: Empty content entries still stored and increment sequence counter. If content is empty after strip_edges(), the entry is still appended with empty content. It won't appear in compaction excerpts, but it consumes a sequence number and storage slot. Recommendation: Add early return false for empty trimmed_content.
      - PASS: Clean hexagonal architecture: port -> adapter -> service separation with proper DI
      - PASS: Role-based retrieval correctly differentiates kid (hide blocked/parent-only) from parent (show all, redact blocked)
      - PASS: Compaction preserves blocked_entry_refs without leaking blocked text — good audit/safety balance
      - PASS: Polish-first messages
      - PASS: Deterministic sequencing via seq counter ensures repeatable ordering
      - PASS: Content hashing provides audit traceability for blocked entries
      - PASS: Comprehensive 43 test assertions covering edge cases, role-based filtering, and deterministic ordering
      - PASS: Optional moderation integration — entries can be auto-checked or pre-flagged via metadata
      - APPROVE: Well-structured AI memory layer with clean hexagonal separation, role-based retrieval, and compaction that preserves audit refs without leaking blocked text.

