  - id: VS-046
    title: Translate the Ziemek and Gniewko concept references into distinct playable hero looks
    owner: codex
    specialty: character-visual-direction
    inputs:
      - data/concepts/ziemek-gniewko-character-turnarounds-v1.png
      - src/adapters/inbound/gameplay/gameplay_runtime.tscn
      - src/adapters/inbound/gameplay/player_controller.gd
      - src/adapters/inbound/gameplay/facial_performance.gd
    dependencies: [VS-022, VS-045]
    acceptance_criteria:
      - The default hero no longer reads as an unrelated blue uniform: Ziemek has the turquoise graphic hoodie, dark trousers and backpack language from the approved concept, while Gniewko retains his distinct light top/dark-trouser silhouette
      - Both heroes use the same grounded humanoid rig and face-performance attachment; no detached face, floating weapon or child-photo texture is used
      - Local split-screen selects two visually distinct heroes without breaking tool sockets, locomotion, customization, persistence or speech/emotion playback
      - A close and third-person live capture plus independent visual review are retained before this task can close
    cross_review_by: claude
    status: in_progress
    einstein_cr_findings:
      - HIGH: Identity and wardrobe override were not persisted; load always forced the preset. ADDRESSED: CharacterCustomization now persists hero_identity and use_signature_outfit; legacy saves retain swatches and a child changing a swatch opts out of the first-run preset.
      - HIGH: Face swaps removed held tool visuals and retained a stale bone-anchor reference. ADDRESSED: The visual tier is cached, the anchor is cleared during the rig replacement, and the tool is rebuilt on the replacement skeleton; focused coverage proves it.
      - HIGH: UV/colour heuristics and the generic source rig cannot meet the supplied patterned-hoodie, detailed-backpack, child-proportioned concept bar. OPEN: Requires a rig-compatible authored garment/child-hero asset plus close and third-person captures for both heroes.
      - MEDIUM: Initial coverage lacked tool-replacement and split-player identity checks. PARTIALLY ADDRESSED: Added held-tool-after-face-swap and P2/Gniewko grounded split-screen contracts. Rendered close-up and speech evidence remain open.
      - REQUEST_CHANGES: Concept-quality gate still open. Visual quality gate remains open.
    evidence:
      - src/adapters/inbound/gameplay/player_controller.gd (Ziemek identity uses the existing animated/facial rig, UV garment recolour and supplied backpack mesh; no rigid capsule-clothing proxies)
      - src/adapters/inbound/gameplay/shaders/hero_clothing.gdshader (selective garment/trouser recolour for Kenney's shared toon atlas)
      - tests/adapters/inbound/test_hero_identity_layer.gd (grounded hero layer, backpack, shader parameters and Gniewko-switch regression coverage)
      - tests/adapters/inbound/test_split_screen_hero_pairing.gd (P2 Gniewko selection, matched capsule/camera grounding and shared-world pairing coverage)
      - .ai/reviews/VS-046-hero-identity-review-2026-07-18.json (independent adversarial review; persistence/tool lifecycle findings addressed, concept-quality gate still open)
