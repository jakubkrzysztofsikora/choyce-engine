  - id: TASK-041
    title: Implement AI visual asset generation pipeline with child-safe style presets and moderation gates
    owner: codex
    specialty: ai-assets
    inputs:
      - docs/requirements/functionality-requirements.md
      - docs/requirements/technology-requirements.md
      - docs/requirements/architecture-requirements.md
    dependencies: [TASK-003, TASK-012, TASK-015]
    acceptance_criteria:
      - Visual asset generation integrates through ports and deterministic tool-calling flow
      - Child mode enforces safe preset styles and blocks photoreal-human generation by default
      - Generated assets are moderated before preview or apply operations
    cross_review_by: claude
    status: done
    claude_cr_findings:
      - MEDIUM: _preview_cache is unbounded and never pruned for abandoned previews. Each request_preview adds an entry to _preview_cache. Only apply_preview and discard_preview remove entries. A user who previews many images without applying or discarding will accumulate stale entries indefinitely. Recommendation: Add a MAX_PREVIEW_CACHE constant (e.g., 20) and evict oldest entries when exceeded, or add time-based expiry using the clock dependency.
      - MEDIUM: _build_preview_id uses non-cryptographic hash with collision risk. _build_preview_id generates 'preview_%d' via absi(seed.hash()). GDScript .hash() is not collision-resistant. Two different project/world/asset/style combinations could produce the same preview_id, causing the second preview to overwrite the first in _preview_cache. Recommendation: Incorporate a monotonic counter or timestamp in the preview_id to guarantee uniqueness within a session.
      - LOW: Photoreal-human term lists diverge between service and orchestration. VisualAssetGenerationService.PHOTOREAL_HUMAN_TERMS includes 'fotorealistyczny', 'realistyczny czlowiek', 'portret czlowieka'. RequestAICreationHelpService._contains_human_visual_term includes 'person', 'osoba' which are absent from the service list. Recommendation: Extract a shared PHOTOREAL_HUMAN_TERMS constant into the shared kernel or a policy class referenced by both.
      - LOW: _resolve_style_for_actor uses duck-typing for generator capabilities. _resolve_style_for_actor checks _visual_generator.has_method('get_allowed_styles') to dynamically query the adapter's style list. This is not part of the VisualGenerationPort contract. Recommendation: Add get_allowed_styles() -> Array[String] to VisualGenerationPort with a default returning the CHILD_SAFE_STYLES constant.
      - LOW: Language hardcoded to 'pl-PL' in generate_image call. The generate_image call passes 'pl-PL' as a literal string. While Polish-first is the project default, this ignores the localization policy port used elsewhere. Recommendation: Consider injecting LocalizationPolicyPort and using get_locale() for consistency.
      - PASS: Defense-in-depth: style enforcement at both orchestration (tool validation) and service level
      - PASS: Dual moderation gates: check_text on prompt AND check_image on generated bytes before preview
      - PASS: Re-moderation on apply — prevents TOCTOU where moderation policy changes between preview and apply
      - PASS: Comprehensive photoreal-human blocking with English + Polish term lists for kid mode
      - PASS: PNG magic bytes in test adapter ensures format-aware moderation compatibility
      - PASS: Clean preview/apply/discard lifecycle with deterministic preview IDs
      - PASS: Watermark metadata tag 'ai_visual' on all generated assets for downstream identification
      - PASS: SafetyInterventionTriggeredEvent emission for all block paths with specific policy rules
      - PASS: visual_generate schema in AIToolRegistry with strict required args and no unknown args allowed
      - PASS: 11 contract assertions covering preview, apply, photoreal blocking, re-moderation on apply, and event emission
      - APPROVE: Comprehensive child-safe visual generation pipeline with defense-in-depth style enforcement, dual moderation gates, re-moderation on apply, and proper tool registry integration.

