  - id: TASK-017
    title: Implement Polish-first STT pipeline with local-first and opt-in fallback
    owner: mistral
    specialty: voice-integration
    inputs:
      - docs/requirements/functionality-requirements.md
      - docs/requirements/technology-requirements.md
    dependencies: [TASK-003, TASK-007]
    acceptance_criteria:
      - SpeechToTextPort supports Polish recognition tuned for child pronunciation
      - Cloud fallback requires parent opt-in and preserves Polish intent extraction
    cross_review_by: claude
    status: done
    claude_cr_findings:
      - HIGH: CloudSTTAdapter.transcribe() with empty profile_id (the default) bypasses consent check entirely — consent is only verified when profile_id != ''. This is a fail-open pattern: any caller that doesn't explicitly pass profile_id gets unguarded cloud access. For child safety, empty profile_id MUST block cloud transcription. Fix: if profile_id == '' or not _consent_port.has_consent(profile_id, 'cloud_stt'): return ''
      - HIGH: PolishIntentExtractor references AgeBand.CHILD_5_7 and AgeBand.TEEN_13_15 which do not exist in the AgeBand enum. The actual values are AgeBand.Band.CHILD_6_8 and AgeBand.Band.TEEN. This will cause a runtime error. Also, setup() expects an AgeBand instance but the default value tries to use a non-existent enum constant.
      - HIGH: CloudSTTAdapter and STTFallbackChain break the SpeechToTextPort contract by adding extra parameters (profile_id, allow_cloud_fallback) to transcribe(). Callers holding a SpeechToTextPort reference cannot pass profile_id without knowing the concrete type, defeating port abstraction. profile_id should be injected via setup() or a set_profile() method, not through the transcribe() signature.
      - MEDIUM: Polish normalization uses global substring replacement: 'cie' -> 'ci' corrupts common words like 'ciekawy' (interesting), 'ciebie' (you), 'ciepły' (warm), 'ciemny' (dark). 'sia' -> 'się' corrupts 'Kasia' (name) -> 'Kasię'. Use word-boundary or whole-word matching instead of String.replace().
      - MEDIUM: STTFallbackChain stores concrete types (LocalSTTAdapter, CloudSTTAdapter) instead of SpeechToTextPort interface. This violates hexagonal architecture — application-layer services should depend on port interfaces only.
      - MEDIUM: Intent extraction only matches infinitive verb forms ('budować', 'usunąć'). Polish children primarily use imperative forms: 'buduj', 'zbuduj', 'zrob', 'usuń', 'przesuń', 'zagraj'. Add these common imperative forms for child speech.
      - MEDIUM: transcribe() mutates _language instance state as a side effect. Subsequent calls with empty language parameter silently use the previously-set language. Use the parameter locally without storing it: var effective_language := language if language != '' else _language.
      - LOW: PackedByteArray().fill(1, 250) in test is incorrect GDScript API — fill() returns void and takes a single value argument. Should be: var arr := PackedByteArray(); arr.resize(250); arr.fill(1).
      - LOW: No dedicated unit test for CloudSTTAdapter consent enforcement. The consent gating (the most safety-critical path) is only indirectly tested through the fallback chain.
      - REQUEST_CHANGES: Fix the three high-severity findings (consent fail-open, nonexistent AgeBand enum values, broken port contract) before re-review.

  - id: TASK-018
    title: Implement AI failsafe mode and graceful helper degradation
    owner: codex
    specialty: reliability
    inputs:
      - docs/requirements/architecture-requirements.md
      - docs/requirements/functionality-requirements.md
    dependencies: [TASK-012, TASK-015]
    acceptance_criteria:
      - Failsafe mode disables generative output while keeping core editor usable
      - Rules-based hint helper activates when model services are unavailable
    cross_review_by: claude
    status: done
    claude_cr_findings:
      - MEDIUM: _is_model_unavailable relies on undocumented duck-typed method on LLMPort. _is_model_unavailable() checks _llm.has_method('get_last_provider') and calls it dynamically. This is not part of the LLMPort contract, so any adapter that doesn't implement this optional method will silently lose the fallback provider detection path. The only fallback signal would be empty response text, which is less reliable. Recommendation: Add get_last_provider() -> String to LLMPort with a default return of '' to formalize the contract. Alternatively, have complete() return a structured result {text: String, provider: String} instead of a bare String.
      - LOW: Failsafe path bypasses output moderation for rules-based hints. When failsafe is enabled, the rules-based hint is returned before the output moderation check. These are hardcoded Polish strings we control, so the risk is minimal, but it breaks the dual-filter consistency where all AI-generated or assistant-produced text passes through ModerationPort.check_text().
      - LOW: Failsafe action ID uses non-cryptographic hash. build_disabled_action uses absi(prompt_text.hash()) for action ID suffix. While failsafe actions are ephemeral and collision risk is very low, this is inconsistent with the push toward more robust ID generation in other services. Recommendation: Append _clock.now_msec() to the action ID instead of or in addition to the hash for uniqueness.
      - LOW: Fallback hint emits BLOCK event for non-safety situation. When the LLM is unavailable and the service falls back to rules-based hints, it emits a SafetyInterventionTriggeredEvent with decision_type='BLOCK'. This is technically a degradation event, not a safety block. Using BLOCK may confuse parent audit timelines where all BLOCKs are expected to represent content safety decisions. Recommendation: Consider using a different decision_type like 'DEGRADE' or 'FALLBACK' to distinguish model-unavailability from safety interventions, or use a separate event type.
      - PASS: Fail-closed design: failsafe returns REJECTED action before any LLM/tool interaction
      - PASS: Polish-first rules-based hints at all 3 scaffolding levels with objective-contextual messages
      - PASS: Model-unavailable detection via empty response + optional provider check covers common failure modes
      - PASS: Proper audit tagging: FAILSAFE_MODE and RULES_HINT_FALLBACK policy rules for event traceability
      - PASS: Clean optional dependency injection: _failsafe=null means no failsafe, matching project patterns
      - PASS: 10 contract assertions covering enable/disable lifecycle, action shape, and hint generation
      - APPROVE: Clean failsafe controller with proper fail-closed semantics, Polish-first rules-based hints, and consistent audit event emission. Integration into both creation and hint services follows established optional dependency pattern.

