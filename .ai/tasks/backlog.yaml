      - tests/application/test_plugin_sdk.gd (comprehensive tests)
      - data/templates/*.json (adventure, city, farm, obby, tycoon)
    codex_cr_findings:
      - PASS: Template loader loads from data/templates/*.json (not hardcoded)
      - PASS: create_project_from_template parses JSON and creates Project/World/SceneNode/GameRule
      - PASS: PluginSDK enforces declared ports via can_access_port()
      - PASS: PluginSDK enforces declared tools via can_register_tool()
      - PASS: PluginSDK requires signed manifests (rejects unsigned/tampered)
      - PASS: PluginManifest supports HMAC-SHA256 signing with ManifestSignature
      - PASS: Comprehensive test coverage for both template loader and plugin SDK
      - PASS: Template files exist for adventure, city, farm, obby, tycoon
